<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThinQ A11y Checker</title>
  </head>
  <body>
    <main id="app" class="popup-shell">
      <header>
        <h1>ThinQ A11y</h1>
        <p>IBM Equal Access scan</p>
      </header>

      <form id="settings-form" class="settings-form">
        <label>
          <span>Title</span>
          <input id="title" name="title" type="text" placeholder="ThinQ Web" />
        </label>

        <label>
          <span>Accessibility standard</span>
          <select id="accessibilityStandard" name="accessibilityStandard">
            <option value="IBM_Accessibility">IBM Accessibility (A, AA)</option>
            <option value="WCAG_2_2">WCAG 2.2 (A, AA)</option>
            <option value="WCAG_2_1">WCAG 2.1 (A, AA)</option>
            <option value="WCAG_2_0">WCAG 2.0 (A, AA)</option>
          </select>
        </label>
        <div class="exclusions-link-container">
          <a href="exclusions.html" target="_blank" class="exclusions-link">미검출 협의 항목</a>
        </div>

        <div class="settings-row-2col">
          <label>
            <span>Rule set</span>
            <select id="ruleSet" name="ruleSet">
              <option value="latest">latest</option>
              <option value="versioned">versioned</option>
            </select>
          </label>

          <label>
            <span>Depth</span>
            <select id="maxDepth" name="maxDepth">
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
        </div>

        <div class="issue-levels-container">
          <span>Include issue levels</span>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input id="level-violation" type="checkbox" checked disabled />
              <span>Violation</span>
            </label>
            <label class="checkbox-label">
              <input id="level-needs-review" type="checkbox" />
              <span>Needs review</span>
            </label>
            <label class="checkbox-label">
              <input id="level-recommendation" type="checkbox" />
              <span>Recommendation</span>
            </label>
          </div>
        </div>
      </form>

      <section class="controls" aria-label="Run controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button">Stop</button>
        <button id="recon" type="button" class="recon-btn" style="display: none;">🔍 Recon Scan</button>
        <button id="download" type="button" disabled>Download report</button>
        <button id="downloadLog" type="button" disabled>Download debug log</button>
      </section>

      <section class="status-panel" aria-live="polite">
        <div class="status-line">
          <span>Status</span>
          <strong id="status">Idle</strong>
        </div>
        <div class="status-line">
          <span>Current Screen</span>
          <strong id="currentScreenTitle">-</strong>
        </div>
        <div class="status-line">
          <span>Depth</span>
          <strong id="depth">0/0</strong>
        </div>
        <div class="status-line">
          <span>Screens</span>
          <strong id="screenCount">0</strong>
        </div>
      </section>

      <ol id="logs" class="logs" aria-label="Execution log"></ol>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
